  <style>
    .gev-navbar { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%) !important; min-height: 75px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); padding: 0.6rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    .gev-logo-wrapper { background: rgba(255, 255, 255, 0.08); padding: 8px; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); }
    .gev-logo { width: 42px; height: 42px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)); }
    .gev-brand-text { font-size: 1.35rem; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; white-space: nowrap; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); }
    .gev-nav-menu { gap: 0.3rem; }
    .gev-nav-link { color: #cbd5e1 !important; font-size: 0.95rem; font-weight: 500; padding: 0.6rem 1rem !important; transition: all 0.3s ease; border-radius: 8px; display: flex; align-items: center; gap: 7px; }
    .gev-nav-icon { font-size: 0.85rem; opacity: 0.85; }
    .gev-nav-link:hover, .gev-nav-link:focus { color: #ffffff !important; background: rgba(99, 102, 241, 0.15); box-shadow: 0 2px 6px rgba(99, 102, 241, 0.2); }
    .gev-dropdown { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 0.6rem 0; min-width: 220px; margin-top: 0.5rem; }
    .gev-dropdown-item { color: #cbd5e1; padding: 0.7rem 1.3rem; font-size: 0.9rem; transition: all 0.25s ease; display: flex; align-items: center; gap: 12px; border-radius: 8px; margin: 0.2rem 0.5rem; }
    .gev-dropdown-item i { font-size: 0.95rem; width: 20px; text-align: center; opacity: 0.8; }
    .gev-dropdown-item:hover, .gev-dropdown-item:focus { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2)); color: #ffffff; transform: translateX(4px); }
    .gev-btn-donate { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #ffffff; font-weight: 600; font-size: 0.9rem; padding: 0.55rem 1.1rem; border: none; border-radius: 8px; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    .gev-btn-donate:hover { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); color: #ffffff; }
    .gev-btn-login { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #ffffff; font-weight: 600; font-size: 0.9rem; padding: 0.55rem 1.3rem; border: none; border-radius: 8px; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3); }
    .gev-btn-login:hover { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); color: #ffffff; }
    .gev-toggler { border: 2px solid rgba(255, 255, 255, 0.2); padding: 0.5rem 0.7rem; border-radius: 10px; background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
    .gev-toggler:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }
    .gev-nav-link.active { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2)); color: #ffffff !important; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3); }
    @media (max-width: 991.98px) {
      .navbar-collapse { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 1.5rem; border-radius: 0 0 16px 16px; margin-top: 1rem; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-top: none; }
      .gev-nav-link { text-align: center; padding: 0.8rem 1rem !important; justify-content: center; }

    }
    @media (max-width: 575.98px) {
      .gev-brand-text { display: none; }
      .gev-logo { width: 36px; height: 36px; }
      .gev-nav-icon { display: none; }
